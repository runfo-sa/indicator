name: indicator

services:
  api:
    build: ./api
    environment:
      API_ADDR: ":8080"
    ports:
      - "${LAN_IP:?Set LAN_IP in .env to this computer's LAN IPv4 address}:${API_PORT:-8080}:8080"

  web:
    build: ./web
    ports:
      - "${LAN_IP:?Set LAN_IP in .env to this computer's LAN IPv4 address}:${WEB_PORT:-5173}:5173"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-indicator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-indicator}
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  dev:
    profiles: ["dev"]
    build:
      context: ./dev
      dockerfile: Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - android-gradle-cache:/root/.gradle
      - go-cache:/root/go/pkg/mod
      - web-pnpm-node-modules:/workspace/web/node_modules
      - web-pnpm-store:/workspace/.pnpm-store
    command: ["sleep", "infinity"]

volumes:
  postgres-data-v18:
  android-gradle-cache:
  go-cache:
  web-pnpm-node-modules:
  web-pnpm-store:
